# パスの起点はリポジトリのルート

- id: "case_001"
  cell: 1
  description: "要対応: 情報が揃っており、発動条件を満たす"
  profile_path: "stack-profile.vulnerable.yaml"
  alas_path: "ALAS2023-2025-1318.txt"
  cve_id: "CVE-2025-58098"
  expected:
    status: "要対応"
    missing_config_keys: []

- id: "case_002"
  cell: 2
  description: "要確認: mod_userdir, suexec は true だが allow_override_fileinfo のみ未定義(不足1つ)"
  profile_path: "stack-profile.yaml"
  alas_path: "ALAS2023-2025-1318.txt"
  cve_id: "CVE-2025-66200"
  expected:
    status: "要確認"
    missing_config_keys: ["allow_override_fileinfo"]

