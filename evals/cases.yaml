# パスの起点はリポジトリのルート

- id: "case_001"
  cell: 1
  description: "要対応: 情報が揃っており、発動条件を満たす"
  profile_path: "stack-profile.vulnerable.yaml"
  alas_path: "ALAS2023-2025-1318.txt"
  cve_id: "CVE-2025-58098"
  expected:
    status: "要対応"
    missing_config_keys: []

- id: "case_002"
  cell: 2
  description: "要確認: mod_userdir, suexec は true だが allow_override_fileinfo のみ未定義(不足1つ)"
  profile_path: "stack-profile.yaml"
  alas_path: "ALAS2023-2025-1318.txt"
  cve_id: "CVE-2025-66200"
  expected:
    status: "要確認"
    missing_config_keys: ["allow_override_fileinfo"]

- id: case_003
  cell: 3
  description: "要確認: SSI有効(ssi_enabled: true)だが、mod_cgid_enabled および mod_cgi_enabled が未定義(不足2つ)。※#exec使用は成立と仮定"
  profile_path: stack-profile.cell3-ssi.yaml
  alas_path: ALAS2023-2025-1318.txt
  cve_id: CVE-2025-58098
  expected:
    status: 要確認
    missing_config_keys:
      - mod_cgid_enabled
      - mod_cgi_enabled

- id: "case_004"
  cell: 4
  description: "対応不要: valkey未導入(installed: false)。発動条件はバージョンのみのため未導入で確定"
  profile_path: "stack-profile.yaml"
  alas_path: "ALAS2023-2026-3091.txt"
  cve_id: "CVE-2026-82631"
  expected:
    status: "対応不要"
    missing_config_keys: []

- id: "case_005"
  cell: 5
  description: "対応不要: mod_cgi_enabledが未定義だが、ssi_enabled: false かつ mod_cgid_enabled: false のため条件崩れ"
  profile_path: "stack-profile.yaml"
  alas_path: "ALAS2023-2025-1318.txt"
  cve_id: "CVE-2025-58098"
  expected:
    status: "対応不要"
    missing_config_keys: []

- id: "case_006"
  cell: 3
  description: "要確認: CVE-2025-66200 の発動条件(allow_override_fileinfo, mod_userdir_enabled, suexec_enabled)がすべて未定義(不足3つ)"
  profile_path: "stack-profile.cell3-userdir.yaml"
  alas_path: "ALAS2023-2025-1318.txt"
  cve_id: "CVE-2025-66200"
  expected:
    status: "要確認"
    missing_config_keys:
      - "allow_override_fileinfo"
      - "mod_userdir_enabled"
      - "suexec_enabled"

- id: "case_007"
  cell: 3
  description: "要確認: mod_cgid_enabled: true だが、ssi_enabled および mod_cgi_enabled が未定義(不足2つ)"
  profile_path: "stack-profile.cell3-cgid.yaml"
  alas_path: "ALAS2023-2025-1318.txt"
  cve_id: "CVE-2025-58098"
  expected:
    status: "要確認"
    missing_config_keys:
      - "ssi_enabled"
      - "mod_cgi_enabled"

- id: "case_008"
  cell: 2
  description: "要確認: ssi_enabled: true, mod_cgi_enabled: falseだがmod_cgid_enabledのみ未定義(不足1つ)"
  profile_path: "stack-profile.cell2-ssi.yaml"
  alas_path: "ALAS2023-2025-1318.txt"
  cve_id: "CVE-2025-58098"
  expected:
    status: "要確認"
    missing_config_keys:
      - "mod_cgid_enabled"

- id: "case_009"
  cell: 2
  description: "要確認: allow_override_fileinfo: true, suexec_enabled: trueだがmod_userdir_enabledのみ未定義(不足1つ)"
  profile_path: "stack-profile.cell2-userdir.yaml"
  alas_path: "ALAS2023-2025-1318.txt"
  cve_id: "CVE-2025-66200"
  expected:
    status: "要確認"
    missing_config_keys:
      - "mod_userdir_enabled"

- id: "case_010"
  cell: 4
  description: "対応不要: ssi_enabled: false, mod_cgid_enabled: false, mod_cgi_enabled: false がすべて明記され、条件が2つ以上否定されている(case_005の対照ペア)"
  profile_path: "stack-profile.cell4-ssi.yaml"
  alas_path: "ALAS2023-2025-1318.txt"
  cve_id: "CVE-2025-58098"
  expected:
    status: "対応不要"
    missing_config_keys: []

- id: "case_011"
  cell: 4
  description: "対応不要: allow_override_fileinfo: true, suexec_enabled: true, mod_userdir_enabled: false がすべて明記され、圧縮条件(mod_userdir)で否定(case_009の対照ペア)"
  profile_path: "stack-profile.cell4-userdir.yaml"
  alas_path: "ALAS2023-2025-1318.txt"
  cve_id: "CVE-2025-66200"
  expected:
    status: "対応不要"
    missing_config_keys: []

- id: "case_012"
  cell: 4
  description: "対応不要: verify_host_key_dns_enabled: false で明示的に否定。条件は1つ(基本形)"
  profile_path: "stack-profile.cell4-openssh.yaml"
  alas_path: "ALAS2023-2025-865.txt"
  cve_id: "CVE-2025-26465"
  expected:
    status: "対応不要"
    missing_config_keys: []

- id: "case_013"
  cell: 4
  description: "対応不要: proxy_ssl_enabled: false で明示的に否定。ALAS の本文に条件が明示された形(when configured to proxy to upstream TLS servers)"
  profile_path: "stack-profile.cell4-nginx.yaml"
  alas_path: "ALAS2023-2026-1436.txt"
  cve_id: "CVE-2026-1642"
  expected:
    status: "対応不要"
    missing_config_keys: []

- id: "case_014"
  cell: 4
  description: "対応不要: printing: 'cups'(値/文字列挙値)で否定。print_command_has_percent_j: trueと合わせて条件キーを2つとも完備"
  profile_path: "stack-profile.cell4-samba.yaml"
  alas_path: "ALAS2023-2026-1895.txt"
  cve_id: "CVE-2026-4480"
  expected:
    status: "対応不要"
    missing_config_keys: []
