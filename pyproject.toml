[project]
name = "aws-vuln-triage-agent"
version = "0.1.0"
description = "LLMを活用したAWS/Webシステム向け脆弱性自動トリアージ・構成キー抽出エージェント"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]
[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
