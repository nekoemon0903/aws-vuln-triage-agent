# コンポーネントごとのコンテキスト定義
# [MEMO] evals セル3用のダミー(case_037): cgi: false(成立条件)のみ明記、ssiとcgidは未定義
components:
  httpd:
    owner: "xxx@example.com"
    usage_context: "コーポレートサイトをホストし、事業活動の継続に必要なため"
    criticality: "medium"
    current_configurations:
      installed: true
      mod_cgi_enabled: false
    operational_constraints:
      - "パッチ適用(サービス再起動)の際は運用側との事前調整が必要"
