# コンポーネントごとのコンテキスト定義
# [MEMO] evals セル4用のダミー(case_013)proxy_ssl_enabled を明示的に指定
components:
  nginx:
    owner: "xxxx@example.com"
    usage_context: "Webアプリケーションのリバースプロキシおよび静的コンテンツ配信として使用するため"
    criticality: "high"
    current_configurations:
      installed: true
      proxy_ssl_enabled: false
    operational_constraints:
      - "パッチ適用（サービス再起動）の際は運用側との事前調整が必要"
