# コンポーネントごとのコンテキスト定義
# [MEMO] evalsセル4用のダミー(case_016) printing: cups と print_command_has_percent_j: false の2つで否定
components:
  samba:
    owner: "xxx@example.com"
    usage_context: "社内のファイル共有及びCUPS連携によるプリントサーバーとして利用"
