# コンポーネントごとのコンテキスト定義
# [MEMO] evals セル5用のダミー(case_027): mod_userdir_enabled: false で否定(崩れ1)、allow_override_fileinfo は欠落(不成立側)
components:
  httpd:
    owner: "xxx@example.com"
    usage_context: "コーポレートサイトをホストし、事業活動の継続に必要なため"
    criticality: "medium"
    current_configurations:
      installed: true
      mod_userdir_enabled: false
      suexec_enabled: true
    operational_constraints:
      - "パッチ適用(サービス再起動)の際は運用側との事前調整が必要"
